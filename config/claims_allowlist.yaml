# ==============================================================================
# Claims Allowlist (Source of Truth for Proposal Pitches)
#
# NOTE: config/profile.yaml tiers describe work I may ACCEPT, while this file
# lists what pitches may CLAIM. Every claim here traces strictly to Hany's CV
# and verified portfolio projects. Pitches must never invent skills, tools,
# clients, years of experience, or certifications not listed here.
# ==============================================================================

allowed_claims:
  education:
    - "B.Sc. student in Navigation & Space Technology"
    - "Solid mathematical and machine learning fundamentals"
    - "Junior ML Engineer based in Egypt"

  languages:
    - "Arabic native speaker"
    - "Fluent English (C1 level)"

  tabular_ml:
    - "Python, NumPy, Pandas, scikit-learn, XGBoost"
    - "Feature engineering, hyperparameter search, and precision-recall threshold tuning for imbalanced classification"
    - "NASA Space Apps 3rd place (team lead for Sky-Spy exoplanet classifier using tuned XGBoost, FastAPI, and Streamlit)"
    - "Built Kessler-Shield orbital collision warning handling ~1:1300 class imbalance without oversampling, deployed as cloud microservices"

  data_engineering:
    - "Relational schema design, normalization, data cleaning, and deduplication"
    - "ETL pipelines using PostgreSQL and SQLAlchemy ORM (TicketSense project resolving 441 customer duplicates and schema normalization)"
    - "Web scraping and ETL fundamentals from the DEPI data engineering track"

  deployment:
    - "FastAPI REST API backend development and model serving"
    - "Interactive dashboards and data visualizations with Streamlit, Plotly, and Matplotlib"
    - "Cloud deployment on Railway and Streamlit Cloud"

  fundamentals_and_dsp:
    - "The ML Blueprint: derived core ML algorithms from first principles in NumPy, including manual neural network forward/backward passes"
    - "Signal processing and DSP: leading DSP pipeline for FMCW Radar simulation; completed range-velocity-angle data cube extraction, with CFAR detection currently in progress in MATLAB/Python"

  deep_learning:
    # Strictly honest phrasing per Master Prompt section 2
    - "I work with PyTorch and have built CNN training pipelines with custom datasets; I'm currently deepening my deep-learning skills."

forbidden_patterns:
  - "\\b(?:\\d+|many|several)\\s+years\\s+(?:of\\s+)?(?:experience|working|in)\\b"
  - "\\b(?:senior|lead|principal|director)\\s+(?:engineer|developer|scientist)\\b"
  - "\\bproduction\\s+(?:DL|deep\\s+learning)\\s+systems?\\b"
  - "\\bworked\\s+with\\s+(?:dozens|hundreds|many)\\s+clients?\\b"
  - "\\b100%\\s*(?:guarantee|success|accuracy)\\b"
  - "\\bguaranteed\\s+(?:results|accuracy|satisfaction)\\b"
  - "\\bexpert\\s+in\\s+(?:all|everything)\\b"
  - "\\b(?:ResNet|EfficientNet|YOLO|HuggingFace|BERT|transformers)\\b"
  - "\\b(?:MySQL|MongoDB)\\b"
