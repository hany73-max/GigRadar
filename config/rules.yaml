    - "دقة 100%"
    - "100% مضمون"
    - "نسبة دقة 99%"
    - "99% accuracy"
    - "100% accuracy"
    - "guaranteed accuracy"
    - "ضمان دقة"

  pure_irrelevant:
    - "wordpress"
    - "shopify"
    - "woocommerce"
    - "ووردبريس"
    - "شوبيفاي"
    - "تصميم لوجو"
