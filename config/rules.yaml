thresholds:
  min_budget_usd: 25.0
  min_hourly_rate_usd: 15.0
  max_existing_bids: 30
  max_gig_age_minutes: 1440 # 24 hours

keyword_families:
  ml_dl:
    name: "Machine Learning & Deep Learning"
    keywords:
      - "machine learning"
      - "deep learning"
      - "تعلم آلي"
      - "تعلم الة"
      - "تعلم عميق"
      - "ذكاء اصطناعي"
      - "نموذج"
      - "تدريب نموذج"
      - "model training"
      - "neural network"
      - "شبكة عصبية"
      - "pytorch"
      - "tensorflow"
      - "keras"
      - "scikit-learn"
      - "xgboost"
      - "fine-tune"
      - "تحسين نموذج"
      - "classification"
      - "تصنيف"
      - "regression"
      - "prediction"
      - "تنبؤ"
      - "forecasting"
      - "time series"
      - "anomaly detection"

  cv:
    name: "Computer Vision"
