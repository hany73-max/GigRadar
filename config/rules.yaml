category_rules:
  deny_categories:
    - "Design & Graphics"
    - "Writing & Translation"
    - "Mobile App Development"
    - "Business Services"
    - "Sales & Marketing"
    - "Video & Animation"
  allow_categories:
    - "Data Science & Analysis"
    - "Artificial Intelligence & Machine Learning"
    - "Software Development"
    - "Web Scraping"
    - "Database Administration"
