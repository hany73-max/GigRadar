      - "data pipeline"
      - "data cleaning"
      - "تنظيف بيانات"
      - "scraping"
      - "سحب بيانات"
      - "web scraping"
      - "postgresql"
      - "sql"
      - "pandas"
      - "dashboard"
      - "لوحة تحكم"
      - "streamlit"
      - "power bi"
      - "data analysis"
      - "تحليل بيانات"

  backend_deploy:
