      - "fastapi"
      - "rest api"
      - "deploy model"
      - "نشر نموذج"
      - "docker"

ambiguous_keywords:
  "نموذج": "ambiguous_ml_model"
  "تدريب": "ambiguous_training"
  "ذكاء اصطناعي": "ambiguous_ai_imagery"
  "chatbot": "likely_llm_wrapper"
  "شات بوت": "likely_llm_wrapper"

