platforms:
  mostaql:
    name: "Mostaql"
    enabled: true
    type: "scraper"
    base_url: "https://mostaql.com"
    listing_url: "https://mostaql.com/projects"
    poll_interval_seconds: 120
    jitter_seconds_min: 5
    jitter_seconds_max: 20
    max_pages_per_run: 2
    timeout_seconds: 30
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
    thresholds:
      max_existing_bids: 30
      min_budget_usd: 25.0
      max_gig_age_minutes: 1440

  khamsat:
    name: "Khamsat"
    enabled: true
    type: "scraper"
    base_url: "https://khamsat.com"
    listing_url: "https://khamsat.com/community/requests"
    poll_interval_seconds: 180
    jitter_seconds_min: 5
    jitter_seconds_max: 25
    max_pages_per_run: 2
    timeout_seconds: 30
    user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
    thresholds:
      max_existing_bids: 20
      min_budget_usd: 10.0
      max_gig_age_minutes: 1440

  freelancer:
    name: "Freelancer"
    enabled: true
    type: "api"
    base_url: "https://www.freelancer.com"
    base_api_url: "https://www.freelancer.com/api/projects/0.1/"
    poll_interval_seconds: 120
    jitter_seconds_min: 5
    jitter_seconds_max: 15
    max_pages_per_run: 1
    timeout_seconds: 30
    user_agent: "GigRadar/0.1.0"
    max_bid_length_chars: 1500
    skill_ids:
      - 13    # Python
      - 292   # Machine Learning
      - 1601  # Deep Learning
      - 761   # Data Science
      - 2833  # NLP
      - 1558  # Computer Vision
      - 95    # Web Scraping
      - 68    # SQL
      - 334   # Data Mining
    thresholds:
      max_existing_bids: 40
      min_budget_usd: 30.0
      max_gig_age_minutes: 360

