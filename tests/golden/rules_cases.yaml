# Golden test cases for Stage 1 deterministic rules filter
# Covers: Real ML, CV, NLP, Data Engineering, Scraping, Academic, Unpaid trial,
# Policy violations, Guaranteed accuracy, Pure irrelevant web/mobile, Exclude keywords,
# Ambiguous words, Clitic prefixes, Strict Latin boundaries, Title-only (Khamsat),
# Fixed and hourly budgets, and Unknown budget/bids.

